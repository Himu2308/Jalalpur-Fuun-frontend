name: Build customer APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-customer/**"
      - ".github/workflows/customer-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-customer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build installable APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jalalpur-fuun-customer-apk
          path: android-customer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
